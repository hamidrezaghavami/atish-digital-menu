<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>آتیش | Menu Viewer | طعم اصیل گریل و آتش</title>
  <meta name="description" content="منوی دیجیتال فست‌فود و گریل آتیش - برگر ذغالی، پیتزا ایتالیایی، سوخاری و نوشیدنی‌های دست‌ساز" />
  <meta name="theme-color" content="#0e0e10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Persian Font (Vazirmatn) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            vazir: ['Vazirmatn', 'sans-serif'],
          },
          colors: {
            surface: {
              DEFAULT: '#131315',
              dim: '#131315',
              bright: '#39393b',
              lowest: '#0e0e10',
              low: '#1b1b1d',
              base: '#201f21',
              high: '#2a2a2c',
              highest: '#353437',
            },
            'on-surface': '#e5e1e4',
            'on-surface-variant': '#d8c3ad',
            primary: {
              DEFAULT: '#ffc174',
              container: '#f59e0b',
              dim: '#ffb95f',
              fixed: '#ffddb8',
            },
            secondary: {
              DEFAULT: '#ef4444',
              container: '#a40217',
              soft: '#ffb3ad',
            },
            tertiary: {
              DEFAULT: '#ffc32d',
              container: '#e0a800',
            },
            snappfood: '#FF00A6',
            call: '#22C55E',
          },
          boxShadow: {
            'ember-glow': '0 4px 20px -4px rgba(245, 158, 11, 0.25)',
            'amber-pill': '0 2px 12px 0 rgba(245, 158, 11, 0.35)',
            'fab-pink': '0 8px 24px -2px rgba(255, 0, 166, 0.45)',
            'fab-green': '0 8px 24px -2px rgba(34, 197, 94, 0.45)',
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="bg-[#0e0e10] text-[#e5e1e4] font-['Vazirmatn'] antialiased selection:bg-amber-500 selection:text-black min-h-screen">
  <!-- Application Root -->
  <div id="app"></div>

  <!-- Main JavaScript Entry -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
